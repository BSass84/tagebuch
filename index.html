<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mein Tagebuch</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="kopf">
    <h1>📖 Mein Tagebuch</h1>
    <button type="button" class="speichern" id="startSichern" style="float:right; margin-top:6px;">⤓ Sichern</button>
  </header>
  <main id="startseite">
    <div id="backupBanner" class="eintrag" style="display:none;">
      <div class="datum">📅 Wochen-Backup</div>
      <div>Zeit, deine Einträge zu sichern – ein Tap genügt.</div>
      <button type="button" class="speichern" id="bannerSichern">⤓ Jetzt sichern</button>
      <button type="button" class="speichern" id="bannerSpaeter" style="margin-left:8px;">Später</button>
    </div>
    <p class="hinweis" id="ladehinweis">Funktionen werden geladen …</p>
    <nav id="moduleListe" class="module"></nav>
  </main>
  <script src="js/db.js"></script>
  <script src="js/common.js"></script>
  <script src="js/export.js"></script>
  <script>
    async function baueStartseite() {
      try {
        const antwort = await fetch("modules.json");
        const inventar = await antwort.json();
        const einstellungen = (await holeEinstellung("moduleEinstellungen")) || {};
        const module = inventar.modules
          .map((m, i) => ({ ...m, platz: einstellungen[m.id]?.reihenfolge ?? i }))
          .sort((a, b) => a.platz - b.platz)
          .filter(m => einstellungen[m.id]?.aktiv !== false);
        const container = document.getElementById("moduleListe");
        container.innerHTML = "";
        for (const m of module) {
          const titel = einstellungen[m.id]?.titel || m.titel;
          const knopf = document.createElement("a");
          knopf.className = "modulKnopf";
          knopf.href = m.datei;
          knopf.innerHTML = `<span class="icon">${m.icon}</span><span>${titel}</span>`;
          container.appendChild(knopf);
        }
        document.getElementById("ladehinweis").style.display = "none";
      } catch (fehler) {
        document.getElementById("ladehinweis").textContent =
          "Fehler beim Laden: " + fehler.message;
      }
    }
    baueStartseite();

    async function starteBackupLogik() {
      // 1. Stiller Tages-Snapshot: einmal pro Tag beim ersten Start
      try {
        const heuteSnapshot = new Date().toISOString().slice(0, 10);
        if ((await holeEinstellung("letzterAutoExport")) !== heuteSnapshot) {
          await erstelleSnapshot();
          await setzeEinstellung("letzterAutoExport", heuteSnapshot);
        }
      } catch (fehler) {
        // Der Snapshot darf den Start niemals blockieren
      }

      // 2. Wochen-Banner: nur montags, einmal pro Montag, abschaltbar
      const banner = document.getElementById("backupBanner");
      const heute = new Date().toISOString().slice(0, 10);
      const istMontag = new Date().getDay() === 1;
      const bannerAus = (await holeEinstellung("exportBannerAus")) === true;
      const schonGezeigt = (await holeEinstellung("letzterBannerTag")) === heute;
      if (istMontag && !bannerAus && !schonGezeigt) {
        banner.style.display = "block";
      }

      document.getElementById("bannerSichern").addEventListener("click", async () => {
        banner.style.display = "none";
        await setzeEinstellung("letzterBannerTag", heute);
        try {
          await exportiereNeues();
        } catch (fehler) {
          // Teilen abgebrochen - die Vorbereitung bleibt in der Historie
        }
      });

      document.getElementById("bannerSpaeter").addEventListener("click", async () => {
        banner.style.display = "none";
        await setzeEinstellung("letzterBannerTag", heute);
      });

      // 3. Sichern-Button oben rechts
      document.getElementById("startSichern").addEventListener("click", async () => {
        try {
          await exportiereNeues();
        } catch (fehler) {
          // Teilen abgebrochen
        }
      });
    }
    starteBackupLogik();
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
